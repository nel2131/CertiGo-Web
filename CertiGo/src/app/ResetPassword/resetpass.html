<div class="login-page">
  <div class="forgot-wrap">
    <div class="key">🔑</div>
    <h1 class="brand">Reset Password</h1>
    <p class="subtitle">Enter your email to recieve verification code</p>

    <div class="login-card">
      <form>
        <p class="code-label">VERIFICATION CODE</p>
        <div class="code-row">
          <input type="text" inputmode="numeric" maxlength="1" (input)="onCodeInput($event, 0)" />
          <input type="text" inputmode="numeric" maxlength="1" (input)="onCodeInput($event, 1)" />
          <input type="text" inputmode="numeric" maxlength="1" (input)="onCodeInput($event, 2)" />
          <input type="text" inputmode="numeric" maxlength="1" (input)="onCodeInput($event, 3)" />
        </div>
        <p class="resend">DIDN'T RECEIVE CODE? <a href="#">Resend code in 60s</a></p>

        <label for="newpass">NEW PASSWORD</label>
        <div class="field">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input id="newpass" [type]="showPassword ? 'text' : 'password'" placeholder="••••••••••••" />
          <button type="button" class="eye" (click)="togglePassword()" aria-label="Toggle password visibility">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <label for="confirm">CONFIRM PASSWORD</label>
        <div class="field">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input id="confirm" [type]="showConfirmPassword ? 'text' : 'password'" placeholder="••••••••••••" />
          <button type="button" class="eye" (click)="toggleConfirmPassword()" aria-label="Toggle confirm password visibility">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <button type="submit" class="submit">RESET PASSWORD</button>
      </form>
    </div>
  </div>
</div>
