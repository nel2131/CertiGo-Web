<div class="login-page">
  <section class="login-side">
    <span class="deco deco-circle" aria-hidden="true"></span>
    <span class="deco deco-block" aria-hidden="true"></span>

    <div class="login-card">
      <h1 class="brand">Certi<span>Go.</span></h1>
      <p class="subtitle">Barangay Administrative Portal</p>

      <form (submit)="goToDashboard($event)">
        <label for="email">Email / Username</label>
        <div class="field">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="M22 6l-10 7L2 6"></path>
          </svg>
          <input id="email" type="email" placeholder="admin@barangay.gov.ph" />
        </div>

        <label for="password">Password</label>
        <div class="field">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input id="password" [type]="showPassword ? 'text' : 'password'" placeholder="••••••••••••" />
          <button type="button" class="eye" (click)="togglePassword()" aria-label="Toggle password visibility">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <div class="row">
          <label class="remember">
            <input type="checkbox" />
            <span>Remember this workstation</span>
          </label>
          <a routerLink="/forgot-password" class="forgot">Forgot Password?</a>
        </div>

        <button type="submit" class="submit">LOG IN TO DASHBOARD</button>
      </form>

      <p class="register">Don't have an account? <a routerLink="/signup">Register here</a></p>

      <p class="footer">Barangay Governance System &bull; Secure Portal</p>
    </div>
  </section>

  <aside class="panel">
    <svg class="panel-weave" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <pattern id="weave" width="44" height="26" patternUnits="userSpaceOnUse">
          <path d="M0 26 L11 13 L22 26 L33 13 L44 26" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="3" />
          <path d="M0 0 L11 13 L22 0 L33 13 L44 0" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3" />
        </pattern>
      </defs>
      <rect width="400" height="400" fill="url(#weave)" />
    </svg>

    <div class="panel-copy">
      <h2>
        Every resident is a<br />
        priority, served<br />
        with equal <em>dignity.</em>
      </h2>
      <span class="panel-tag">CertiGo &bull; Barangay Governance System</span>
    </div>
  </aside>
</div>
